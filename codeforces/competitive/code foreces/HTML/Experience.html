<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style_exp.css">
</head>
<body>
    <H1><u>My Exepriences</u></H1>
    <!--Unordered list-->
    <div id="sports">
        <label for="sports">
        <h3>Sports</h3>
        <ul>
        <li>Skating</li>
        <li>Swimming</li>
        <li>Badminton</li>
        <li>Lawn Tennis</li>
        <li>Table Tennis</li>
        </ul>
        </label>
    </div>
    <!--Ordered list-->
    <div id="languages">
        <label for="languages">
        <h3>Programming languages</h3>
        <ol>
            <li>C language</li>
            <li>C++</li>
            <li>Python</li>
            <li>Java</li>
            <li>HTML</li>
        </ol>
        </label>
    </div>
    <!--Using tables-->
    <div id="books">
        <label for="books">
        <h3>Books read</h3>
        <table>
            <caption><u>Books read by me</u></caption>
            <thead>
            <tr>
                <th><b>Book name</b></th>
                <th><b>Completion</b></th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>Harry potter all 7 books</td>
                <td>Completed</td>
            </tr>
            <tr>
                <td>Enid blyton 27 books</td>
                <td>Completed</td>
            </tr>
            <tr>
                <td>Atomic Hablits</td>
                <td>Partially read</td>
            </tr>
            <tr>
                <td>The alchemist</td>
                <td>Completed</td>
            </tr>
            <tr>
                <td>Rich dad Poor dad</td>
                <td>Ongoing</td>
            </tr>
        </tbody>
        </table>
        <p>And many more books read..</p>
        </label>
    </div>


</body>
</html>
